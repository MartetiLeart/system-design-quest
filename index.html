// --- animated diagrams ---
// Spec: n = "emoji Label@col,row|..." ("~" prefix = hidden until shown). s = [[ops, caption]].
// ops (space separated): "0>1" or "0>1,2" sends a dot along the arrow; "2!" problem (red); "2+" good/appear (green); "2-" down/dead.
function parseDiagram(d){
  const N=d.n.split("|").map((s,i)=>{const m=s.match(/@(\d),(\d)$/),lab=s.replace(/@\d,\d$/,"").replace(/^~/,"");
    return {hid:s[0]==="~",em:lab.split(" ")[0],txt:lab.split(" ").slice(1).join(" "),c:m?+m[1]:i,r:m?+m[2]:0}});
  const S=d.s.map(([ops,cap])=>({cap,ops:ops.split(" ").filter(Boolean).map(t=>{
    let m=t.match(/^(\d+)>([\d,]+)$/);if(m)return {f:+m[1],to:m[2].split(",").map(Number)};
    m=t.match(/^(\d+)([!+-])$/);if(!m)throw Error("bad op "+t);return {n:+m[1],k:m[2]}})}));
  return {N,S};
}
function wrap(t,w){const out=[];let line="";for(const word of t.split(" ")){if((line+" "+word).trim().length>w&&line){out.push(line);line=word}else line=(line+" "+word).trim()}if(line)out.push(line);return out.slice(0,3)}
function diagram(host,d){
  const {N,S}=parseDiagram(d),W=150,H=100;
  N.forEach(n=>{n.x=n.c*W+W/2;n.y=n.r*H+H/2});
  const vw=(Math.max(...N.map(n=>n.c))+1)*W,vh=(Math.max(...N.map(n=>n.r))+1)*H;
  const edges={};
  const geo=(a,b)=>{const A=N[a],B=N[b],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
    // curve the arrow if a straight line would cross another box
    const hit=N.some((n,k)=>{if(k===a||k===b)return false;const t=((n.x-A.x)*dx+(n.y-A.y)*dy)/(L*L);if(t<=0||t>=1)return false;return Math.hypot(A.x+t*dx-n.x,A.y+t*dy-n.y)<45});
    const o=hit?55:0,cx=(A.x+B.x)/2-dy/L*o,cy=(A.y+B.y)/2+dx/L*o;return `M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}`};
  S.forEach(s=>s.ops.forEach(o=>o.to&&o.to.forEach(t=>{const k=Math.min(o.f,t)+"-"+Math.max(o.f,t);edges[k]=edges[k]||geo(Math.min(o.f,t),Math.max(o.f,t))})));
  host.innerHTML=`<div class="dg-h"><span>👀 See it happen</span><button class="btn ghost sm">↻ Replay</button></div>
  <div style="overflow-x:auto"><svg viewBox="0 0 ${vw} ${vh}" style="min-width:${Math.round(vw*.8)}px" role="img" aria-label="Animated diagram; steps are listed below">
  ${Object.entries(edges).map(([k,p])=>`<path class="ed" data-k="${k}" d="${p}"/>`).join("")}
  ${N.map((n,i)=>`<g class="nd" data-n="${i}"><rect x="${n.x-68}" y="${n.y-40}" width="136" height="80" rx="10"/>
   <text class="em" x="${n.x}" y="${n.y-12}">${esc(n.em)}</text>${wrap(n.txt,16).map((l,j)=>`<text x="${n.x}" y="${n.y+9+j*15}">${esc(l)}</text>`).join("")}</g>`).join("")}
  </svg></div><ol aria-live="polite"></ol>`;
  const svg=host.querySelector("svg"),ol=host.querySelector("ol"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let timer,run=0;
  const node=i=>svg.querySelector(`[data-n="${i}"]`);
  const dot=(f,t)=>{const a=Math.min(f,t),b=Math.max(f,t),p=svg.querySelector(`[data-k="${a}-${b}"]`),L=p.getTotalLength(),rev=f>t;
    p.classList.add("on");const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r",7);svg.appendChild(c);
    const t0=performance.now(),dur=still?1:850;
    (function fr(now){const x=Math.min(1,(now-t0)/dur),pt=p.getPointAtLength(L*(rev?1-x:x));c.setAttribute("cx",pt.x);c.setAttribute("cy",pt.y);
      if(x<1)requestAnimationFrame(fr);else{setTimeout(()=>c.remove(),250);if(N[t].hid)node(t).classList.remove("hid")}})(t0)};
  const play=()=>{clearTimeout(timer);const me=++run;ol.innerHTML="";
    svg.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
    N.forEach((n,i)=>{node(i).setAttribute("class","nd"+(n.hid?" hid":""))});
    let i=0;const step=()=>{if(me!==run||!host.isConnected||i>=S.length)return;const s=S[i++];
      s.ops.forEach(o=>{if(o.to)o.to.forEach(t=>dot(o.f,t));else{const g=node(o.n).classList;
        if(o.k==="+"){g.remove("hid","dead","bad");g.add("good")}else if(o.k==="!")g.add("bad");else g.add("dead")}});
      ol.querySelectorAll(".cur").forEach(e=>e.classList.remove("cur"));
      if(s.cap){const li=document.createElement("li");li.className="cur";li.textContent=s.cap;ol.appendChild(li)}
      timer=setTimeout(step,still?300:1300+(s.cap||"").length*22)};
    step()};
  host.querySelector("button").onclick=play;play();
}

function grade(id,ok){const b=S.boxes[id]||{box:0};b.box=ok?Math.min(b.box+1,GAPS.length-1):0;b.due=Date.now()+GAPS[b.box]*DAY;S.boxes[id]=b}

const level=()=>Math.floor(Math.sqrt(S.xp/50))+1, lvlXp=l=>50*(l-1)**2;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

  <p class="mute">Ask yourself: <i>what would break without this?</i>${last?` · Want more? <a href="${REPO+u.dir}" target="_blank" rel="noopener">Full chapter notes</a>`:""}</p>
  <div class="row"><button class="btn" id="go">${last?"Start quiz →":"Next →"}</button>${k?`<button class="btn ghost" id="prev">← Back</button>`:""}<button class="btn ghost" id="back">Map</button>${last?"":`<button class="btn ghost" id="skip">Skip to quiz</button>`}</div></div>`;
  const startQuiz=()=>quiz(u.q.map((q,j)=>({u:i,j})),{unit:i});
  document.getElementById("go").onclick=()=>last?startQuiz():learn(i,k+1);
  if(k)document.getElementById("prev").onclick=()=>learn(i,k-1);
  if(!last)document.getElementById("skip").onclick=startQuiz;
  document.getElementById("back").onclick=home;
  document.getElementById("go").focus();
  keyHandler=e=>{if(e.key==="ArrowRight")document.getElementById("go").click();if(e.key==="ArrowLeft"&&k)learn(i,k-1)};
}

// items: [{u,j}], ctx: {unit} for a unit run, {review:true} for review
function quiz(items,ctx){
  items=ctx.review?shuffle(items):items;
  let k=0,right=0;
  const show=()=>{
    if(k>=items.length)return ctx.review?done(right,items.length,ctx):explain(ctx.unit,right,items.length);
    const {u,j}=items[k],q=U[u].q[j],opts=shuffle(q.o.map((t,x)=>({t,ok:x===0})));
    scrollTo(0,0);
    app.innerHTML=`<div class="card"><small class="mute">${ctx.review?"Review · "+esc(U[u].t):"Unit "+(u+1)+" · Step 2 of 3: Quiz"} · ${k+1}/${items.length}</small>
    <div class="bar"><i style="width:${k/items.length*100}%"></i></div><h2 style="font-size:19px">${esc(q.q)}</h2>
    <div id="opts">${opts.map((o,x)=>`<button class="opt" data-x="${x}"><kbd>${x+1}</kbd>${esc(o.t)}</button>`).join("")}</div><div id="fb"></div></div>`;
    const pick=x=>{
      const bs=app.querySelectorAll(".opt");if(bs[0].disabled)return;
      bs.forEach((b,y)=>{b.disabled=true;if(opts[y].ok)b.classList.add("ok")});
      const ok=opts[x].ok;if(!ok)bs[x].classList.add("bad");else right++;
      grade(u+"."+j,ok);S.xp+=ok?10:2;save();
      document.getElementById("fb").innerHTML=`<div class="why ${ok?"ok":"bad"}"><b>${ok?"✅ Correct.":"❌ Not quite."}</b> ${esc(q.why)}</div><div class="dg" id="dg"></div><div class="row"><button class="btn" id="nq">Next → <span class="mute" style="color:#0b0e1a99">(Enter)</span></button></div>`;
      if(q.d)diagram(document.getElementById("dg"),q.d);
      document.getElementById("nq").onclick=()=>{k++;show()};document.getElementById("nq").focus();
    };
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.x));
    keyHandler=e=>{const n=+e.key;if(n>=1&&n<=opts.length&&!app.querySelector(".opt").disabled)pick(n-1)};
  };
  show();
}

function explain(i,right,total){
  keyHandler=null;const u=U[i];scrollTo(0,0);
  app.innerHTML=`<div class="card"><small class="mute">Unit ${i+1} · Step 3 of 3: Explain it in your own words</small><h2 style="font-size:19px">${esc(u.ex.p)}</h2>
  <p class="mute">Type as if you're talking to an interviewer. No peeking. Short is fine.</p>
  <textarea id="ta" placeholder="My explanation…"></textarea><div class="row"><button class="btn" id="chk">Compare with key points</button></div><div id="kp"></div></div>`;
  document.getElementById("ta").focus();
  document.getElementById("chk").onclick=()=>{
    document.getElementById("chk").remove();
    document.getElementById("kp").innerHTML=`<h3>Tick each point you actually covered</h3>${u.ex.pts.map((p,x)=>`<label class="pt"><input type="checkbox" data-p="${x}"> ${esc(p)}</label>`).join("")}<div class="row"><button class="btn" id="fin">Finish unit</button></div>`;
    document.getElementById("fin").onclick=()=>{
      const got=app.querySelectorAll("[data-p]:checked").length,frac=got/u.ex.pts.length;
      const stars=(right===total?1:0)+(right/total>=.6?1:0)+(frac>=.6?1:0);
      S.stars[i]=Math.max(S.stars[i]||0,stars);S.xp+=got*5;touchStreak();save();
      done(right,total,{unit:i,got,pts:u.ex.pts.length,stars,s:[right/total>=.6,right===total,frac>=.6]});
    };
  };
}

function done(right,total,ctx){
  keyHandler=null;if(ctx.review){touchStreak();}scrollTo(0,0);
  const nxt=ctx.unit!=null&&ctx.unit<U.length-1?ctx.unit+1:null;
  app.innerHTML=`<div class="card" style="text-align:center"><p class="big">${ctx.review?"🧠":"★".repeat(ctx.stars)+"☆".repeat(3-ctx.stars)}</p>
  <h2>${ctx.review?"Review done":"Unit complete"}</h2><p>Quiz: <b>${right}/${total}</b>${ctx.got!=null?` · Explained: <b>${ctx.got}/${ctx.pts}</b> key points`:""}</p>
  ${ctx.s?`<ul class="chk">${["Got at least 60% of the quiz right","Got the whole quiz right","Explained at least 60% of the key points"].map((t,x)=>`<li>${ctx.s[x]?"⭐":"☆"} ${t}</li>`).join("")}</ul>`:""}
  <p class="mute">${right<total?"Missed questions are waiting in Review now.":"Clean run. These come back later at longer gaps."}</p>
  <div class="row" style="justify-content:center">${nxt!=null?`<button class="btn" id="nu">Next unit →</button>`:""}<button class="btn ghost" id="hm">Map</button>${ctx.unit!=null?`<button class="btn ghost" id="again">Retry unit</button>`:""}</div></div>`;
  document.getElementById("hm").onclick=home;
  if(nxt!=null)document.getElementById("nu").onclick=()=>learn(nxt);
  if(ctx.unit!=null)document.getElementById("again").onclick=()=>learn(ctx.unit);
}

function review(){
  const items=dueIds().slice(0,15).map(id=>{const [u,j]=id.split(".").map(Number);return {u,j}}).filter(x=>U[x.u]&&U[x.u].q[x.j]);
  quiz(items,{review:true});
}
home();
</script>
